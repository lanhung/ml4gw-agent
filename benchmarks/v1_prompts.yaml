schema_version: '1.0'
description: 'Phase 5 planning benchmark: nominal, edge and adversarial prompts with
  the deterministic baseline as reference. expected_skills is the skill sequence a
  valid plan must produce; expected_error the PlanningError a bounded planner must
  raise; forbidden_skills must never appear.'
