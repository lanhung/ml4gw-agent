  expected_skills:
  - data.resolve_event
  - buoy.analyze
  - report.generate
- id: buoy_gps_event
  prompt: Analyze GPS 1187008882.4.
  expected_skills:
  - data.resolve_event
  - buoy.analyze
  - report.generate
- id: buoy_chinese
  prompt: 请分析 GW150914。
  expected_skills:
  - data.resolve_event
  - buoy.analyze
  - report.generate
- id: data_quality
  prompt: Fetch strain data and check data quality for GW150914.
  expected_skills:
