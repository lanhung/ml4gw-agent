schema_version: "1.0"
name: gwak.scan
version: "0.1.0"
description: Scan compatible strain for unmodeled or anomalous gravitational-wave transients.
status: planned
risk: medium
requires_approval: false
adapter:
  kind: python
  entrypoint: gwak_snakemake
  timeout_seconds: 86400
input_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required: [strain_artifact, model_revision]
  properties:
    strain_artifact: {type: string, minLength: 1}
    model_revision: {type: string, minLength: 1}
    top_k: {type: integer, minimum: 1, maximum: 1000, default: 10}
    threshold: {type: number, default: 0.0}
    threshold_calibration:
      description: Provenance of a FAR-calibrated threshold; null means the raw cut.
      type: [object, "null"]
      properties:
        revision: {type: string}
        far_per_year: {type: number, exclusiveMinimum: 0}
        livetime_seconds: {type: number}
        source: {type: string}
      required: [revision, far_per_year]
    stride_seconds: {type: number, exclusiveMinimum: 0, maximum: 4, default: 0.0625}
    target_time:
      description: Requested or catalog time; the score, rank and z-score of the loudest kernel within candidate_window_seconds of it are reported.
      type: [number, "null"]
    candidate_window_seconds: {type: number, exclusiveMinimum: 0, default: 0.6}
    highpass_hz: {type: [number, "null"], minimum: 0}
    psd_length_seconds: {type: number, minimum: 4, maximum: 512, default: 64}
    model_dir: {type: [string, "null"]}
    device: {enum: [cpu, cuda], default: cuda}
    seed: {type: [integer, "null"], minimum: 0}
output_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required: [anomaly_found, top_segments, anomaly_artifact, simulated]
  properties:
    anomaly_found: {type: boolean}
    top_segments: {type: array, items: {type: object}}
    anomaly_artifact: {type: string}
    max_score: {type: number}
    median_score: {type: number}
    threshold: {type: number}
    threshold_calibrated: {type: boolean}
    n_kernels: {type: integer}
    analysis_start: {type: number}
    analysis_end: {type: number}
    target_time: {type: [number, "null"]}
    target_score: {type: [number, "null"]}
    target_zscore: {type: [number, "null"]}
    target_rank: {type: [integer, "null"]}
    target_far_per_year:
      description: Measured background rate at or above the target score from the shipped calibration (null when uncalibrated or below the tabulated range).
      type: [number, "null"]
    max_far_per_year: {type: [number, "null"]}
    model: {type: object}
    simulated: {type: boolean}
preconditions:
  - name: compatible_preprocessing
    description: Input representation and preprocessing must match the selected GWAK models.
    machine_check: gwak_compatible_input
  - name: immutable_model
    description: An immutable model revision must be supplied.
    machine_check: pinned_model_revision
validations:
  - {kind: artifact_exists, target: anomaly_artifact, required: true}
resources:
  cpu_cores: 4
  memory_gb: 16
  gpu: required
  estimated_runtime: seconds for a segment; distributed execution for long scans
tags: [gwak, anomaly, unmodeled]
source_repository: https://github.com/ML4GW/gwak
notes:
  - Real adapter runs the exported GWAK 2.0 TorchScript models in models/gwak (user-trained, pinned by SHA-256 in MANIFEST.json); model_revision must equal the manifest revision. The anomaly threshold is the raw score cut unless threshold_calibration names a background-study FAR; the planner fills it from ml4gw_agent/calibration/gwak_thresholds.json (scripts/gwak_background.py) for the pinned revision.
  - Needs 4096 Hz H1+L1 strain; the planner schedules a dedicated data.fetch at 4096 Hz for GWAK.

