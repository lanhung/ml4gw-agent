schema_version: "1.0"
name: data.inspect
version: "0.2.0"
description: Check detector availability, finite strain, duration, and basic data quality.
status: experimental
risk: low
requires_approval: false
adapter:
  kind: python
  entrypoint: strain_inspect
  timeout_seconds: 900
input_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required: [strain_artifact]
  properties:
    strain_artifact: {type: string, minLength: 1}
    expected_ifos:
      type: array
      items: {enum: [H1, L1, V1, K1]}
    min_duration_seconds: {type: number, minimum: 0}
    require_science_mode: {type: boolean, default: true}
output_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required: [quality_passed, available_ifos, diagnostics_artifact, simulated]
  properties:
    quality_passed: {type: boolean}
    available_ifos: {type: array, items: {type: string}}
    diagnostics_artifact: {type: string}
    issues: {type: array, items: {type: string}}
    duration_seconds: {type: number}
    sample_rate: {type: number}
    simulated: {type: boolean}
preconditions:
  - name: strain_available
    description: A readable strain artifact from data.fetch must exist.
    machine_check: input_artifact
validations:
  - {kind: output_field, target: quality_passed, required: true}
  - {kind: artifact_exists, target: diagnostics_artifact, required: true}
resources:
  cpu_cores: 2
  memory_gb: 4
  gpu: none
  estimated_runtime: seconds
tags: [data, quality, validation]
notes:
  - Real adapter checks readability, expected detectors, equal lengths, finite values, non-constant series, minimum duration, and GWOSC science-segment coverage.
  - quality_passed is false whenever any check fails, including an unreachable segment service; the gate fails closed.

