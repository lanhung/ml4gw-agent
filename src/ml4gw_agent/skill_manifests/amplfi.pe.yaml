schema_version: "1.0"
name: amplfi.pe
version: "0.2.0"
description: Perform rapid likelihood-free parameter estimation with AMPLFI.
status: experimental
risk: medium
requires_approval: false
adapter:
  kind: python
  entrypoint: amplfi_inference
  timeout_seconds: 3600
input_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required: [strain_artifact, coalescence_time, ifos, model_revision]
  properties:
    strain_artifact: {type: string, minLength: 1}
    coalescence_time: {type: number}
    ifos:
      type: array
      minItems: 2
      maxItems: 3
      items: {enum: [H1, L1, V1]}
    model_revision: {type: string, minLength: 1}
    samples: {type: integer, minimum: 100, maximum: 100000, default: 20000}
    device: {enum: [cpu, cuda], default: cuda}
    seed: {type: [integer, "null"], minimum: 0}
    nside: {type: integer, enum: [16, 32, 64, 128, 256], default: 64}
    min_samples_per_pix: {type: integer, minimum: 1, maximum: 100, default: 5}
    use_distance: {type: boolean, default: true}
output_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required: [posterior_artifact, credible_intervals, skymap_artifact, simulated]
  properties:
    posterior_artifact: {type: string}
    credible_intervals: {type: object}
    skymap_artifact: {type: string}
    summary_artifact: {type: string}
    n_samples: {type: integer, minimum: 0}
    coalescence_time: {type: number}
    ifos: {type: array, items: {type: string}}
    model: {type: object}
    simulated: {type: boolean}
preconditions:
  - name: candidate_time
    description: A validated coalescence time must be present.
    machine_check: coalescence_time
  - name: model_support
    description: The event must lie within the trained model's detector and parameter support.
    machine_check: amplfi_model_support
validations:
  - {kind: artifact_exists, target: posterior_artifact, required: true}
  - {kind: artifact_nonempty, target: posterior_artifact, required: true}
resources:
  cpu_cores: 4
  memory_gb: 16
  gpu: preferred
  estimated_runtime: seconds to minutes on GPU
tags: [amplfi, parameter-estimation, posterior]
source_repository: https://github.com/ML4GW/amplfi
notes:
  - Real adapter wraps buoy.models.Amplfi and selects the published HL or HLV checkpoint from the detector set.
  - Writes Buoy's posterior_samples.dat, a FITS sky map, and a credible-interval summary computed from the samples.

